# ─────────────────────────────────────────────────────────────
#  Nginx reverse proxy for Chainlit-WS
#
#  Key responsibilities:
#  - TLS termination (configure certs for production)
#  - HTTP → HTTPS redirect
#  - WebSocket upgrade (Connection: Upgrade)
#  - Static asset caching
#  - Rate limiting at the edge
#  - Gzip compression
#  - Security headers
# ─────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml;

    # ── Rate limiting zone ────────────────────────────────────
    # 10 requests/second per IP, burst up to 20
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m  rate=5r/s;

    # ── Upstream (Node.js app) ────────────────────────────────
    upstream app_backend {
        server app:3000;
        # For multi-instance scaling:
        # server app_1:3000;
        # server app_2:3000;
        keepalive 64;
    }

    # ── HTTP → HTTPS redirect (uncomment for production) ──────
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        # For TLS, change to:
        # listen 443 ssl http2;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;

        server_name _;

        # ── Security headers ──────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ── Static assets (cached aggressively) ──────────────
        location /css/ {
            proxy_pass http://app_backend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location /js/ {
            proxy_pass http://app_backend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── WebSocket endpoint ────────────────────────────────
        # This is the critical piece: we MUST pass Upgrade
        # and Connection headers for WS to work through Nginx.
        location /ws {
            limit_req zone=ws burst=10 nodelay;

            proxy_pass http://app_backend;
            proxy_http_version 1.1;

            # These two headers trigger the HTTP → WS upgrade
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeouts for persistent WS connections
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }

        # ── API endpoints ─────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        # ── Everything else → app ─────────────────────────────
        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }
    }
}
