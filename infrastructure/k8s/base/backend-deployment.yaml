apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildcraft-backend
  namespace: buildcraft
  labels:
    app: buildcraft
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: buildcraft
      component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: buildcraft
        component: backend
    spec:
      serviceAccountName: buildcraft-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: buildcraft/backend:latest
          ports:
            - containerPort: 4000
              name: http
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: buildcraft-config
            - secretRef:
                name: buildcraft-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            failureThreshold: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: buildcraft-backend
  namespace: buildcraft
spec:
  selector:
    app: buildcraft
    component: backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: buildcraft-backend-hpa
  namespace: buildcraft
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: buildcraft-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
